{{- $name := include "cliproxyapi.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-gate
  labels:
    {{- include "cliproxyapi.labels" . | nindent 4 }}
data:
  haproxy.cfg: |
    {{- include "cliproxyapi.gate.cfg" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-relay
  labels:
    {{- include "cliproxyapi.labels" . | nindent 4 }}
data:
  haproxy.cfg: |
    {{- include "cliproxyapi.relay.cfg" . | nindent 4 }}
{{- if .Values.keeper.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-keeper-script
  labels:
    {{- include "cliproxyapi.labels" . | nindent 4 }}
data:
  keeper.sh: |
    {{- .Files.Get "files/keeper.sh" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-keeper
  labels:
    {{- include "cliproxyapi.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# The proxy's own Deployment and nothing else. The admission policy narrows it further.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-keeper
  labels:
    {{- include "cliproxyapi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-keeper
  labels:
    {{- include "cliproxyapi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-keeper
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-keeper
    namespace: {{ .Release.Namespace }}
{{- end }}
